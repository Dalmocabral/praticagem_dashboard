services:
  - type: web
    name: praticagem-dashboard
    runtime: python
    plan: free
    region: ohio
    buildCommand: "npm install && chmod -R +x node_modules/.bin && npm run build && pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
